[package]
name = "yoghurt"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "See what is installed on this machine, and where it came from."
authors = ["Oddur Sigurdsson <oddursusa@gmail.com>"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/oddurs/yoghurt"
homepage = "https://github.com/oddurs/yoghurt"
keywords = ["tui", "packages", "homebrew", "inventory", "cli"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[profile.release]
strip = true
lto = true
codegen-units = 1
