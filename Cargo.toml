[package]
name = "yoghurt"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "See what is installed on this machine, and where it came from."
authors = ["Oddur Sigurdsson <oddursusa@gmail.com>"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/oddurs/yoghurt"
homepage = "https://github.com/oddurs/yoghurt"
keywords = ["tui", "packages", "homebrew", "inventory", "cli"]
categories = ["command-line-utilities", "development-tools"]
# macOS is what this is built for and tested against. It compiles on Linux and
# its tests pass there, which is a portability check rather than support: the
# application, App Store and codesign sources have nothing to read.

[dependencies]
# Homebrew's inventory is a megabyte of nested JSON and the scan cache in 0031
# will be more of it. A hand-rolled parser for that is a bug farm, and this is
# the most exercised pair of crates in the ecosystem.
# Raw mode, the alternate screen, mouse reporting, resize signals and cell
# diffing are each a source of bugs on somebody else's terminal emulator, and
# mouse reporting in particular is not worth reimplementing under
# `unsafe_code = "forbid"`.
crossterm = "0.29"
# Already in the tree via crossterm, so declaring it directly costs no new
# supply chain. Needed because `unsafe_code = "forbid"` rules out calling
# `libc::signal` here, and a terminal left in raw mode is the worst thing this
# program can do to somebody.
signal-hook = { version = "0.4", default-features = false }
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
# Config: the taxonomy needs one, and so do saved facets (0045) and session
# state (0044). Serde-based, so it costs a parser and no new model.
toml = "0.9"
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[profile.release]
strip = true
lto = true
codegen-units = 1
