name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    # The package adapters are per-platform, so both targets are load-bearing.
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: ${{ runner.os }}-cargo-

      # The same command a developer runs locally. CI cannot drift from it.
      - run: ./scripts/task check

  required:
    # The single status check for branch protection to require.
    name: required
    runs-on: ubuntu-latest
    needs: [check]
    if: always()
    steps:
      - name: Verify every job succeeded
        run: |
          if [ "${{ needs.check.result }}" != "success" ]; then
            echo "check: ${{ needs.check.result }}"
            exit 1
          fi
